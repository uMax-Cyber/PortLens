<text x="15" y="190" fill="#89b4fa" font-family="monospace" font-size="13" opacity="0">=== D-Block-24 (US24P250) ===<animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="215" fill="#f38ba8" font-family="monospace" font-size="13" opacity="0">  p2  UP  1000 errs=0  drop=0     flap=154 ⚠<animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="3.7s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="250" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">Found: 5 problem ports across 3 switches<animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.4s" fill="freeze"/></text>
