<text x="15" y="135" fill="#f38ba8" font-family="monospace" font-size="13" opacity="0">  p20 UP  100  errs=35 drop=0     flap=118 ⚠<animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="2.2s" dur="1.5s" repeatCount="indefinite"/></text>
