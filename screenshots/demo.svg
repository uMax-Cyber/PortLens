<text x="15" y="330" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">→ p8 drops 691k — investigate upstream<animate attributeName="opacity" values="0;1" begin="5.3s" dur="0.4s" fill="freeze"/></text>
